[project]
name = "fpl-optimizer"
version = "0.1.0"
description = "Season-long FPL points prediction and squad optimization"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "lightgbm>=4.5.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "ortools>=9.11",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_optimizer"]