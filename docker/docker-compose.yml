services:
  postgres:
    image: postgres:16-alpine
    container_name: fpl_postgres
    environment:
      POSTGRES_USER: fpl_user
      POSTGRES_PASSWORD: fpl_pass
      POSTGRES_DB: fpl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpl_user -d fpl_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fpl_api
    environment:
      DATABASE_URL: postgresql://fpl_user:fpl_pass@postgres:5432/fpl_db
      FPL_API_BASE_URL: https://fantasy.premierleague.com/api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn fpl_optimizer.api.main:app --host 0.0.0.0 --port 8000"
    
  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fpl_scheduler
    environment:
      DATABASE_URL: postgresql://fpl_user:fpl_pass@postgres:5432/fpl_db
      FPL_API_BASE_URL: https://fantasy.premierleague.com/api
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m fpl_optimizer.scheduler

volumes:
  postgres_data:

