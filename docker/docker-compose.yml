services:
  postgres:
    image: postgres:16-alpine
    container_name: fpl_postgres
    environment:
      POSTGRES_USER: fpl_user
      POSTGRES_PASSWORD: fpl_pass
      POSTGRES_DB: fpl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpl_user -d fpl_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: